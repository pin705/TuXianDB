# Local Postgres for development. Production uses a managed Postgres (e.g. Neon) via DATABASE_URL.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tuxian
      POSTGRES_PASSWORD: tuxian
      POSTGRES_DB: tuxian
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
